defaults:
  - model
  - _self_

batch_size: 64

data:
  manifest_path: manifests/librilight_1000h.jsonl
  pitch_cache_path: manifests/pitch_cache/librilight_1000h_spf512.npz
  sample_rate: 44100
  chunk_seconds: 4.0
  num_workers: 4
  val_fraction: 0.05
  # Every clip is RMS-normalised to this level
  target_rms: 0.05

synth:
  ir_length: 256

optim:
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  grad_clip: 1.0
  max_steps: 10000
  warmup_steps: 800
  # Constant by default: a 0.5/1.0/2.0 sweep at 20k steps found intelligibility
  # monotone in temperature (WER 0.34/0.25/0.24), and constant 2.0 matched the
  # old 2.0 -> 0.5 anneal, so the schedule bought nothing. Set tau_end below
  # tau_start to re-enable annealing.
  tau_start: 2.0
  tau_end: 2.0
  tau_anneal_steps: null  # default = max_steps

loss:
  mfcc: 1.0
  mel: 0.0
  stft: 0.0
  entropy: 0.1        # weight of the hinged entropy penalty
  entropy_floor: 1.0  # per-position entropy floor in nats; no pressure above it
  # 4x window overlap (n_fft=2048, hop=samples_per_frame=512). Null falls
  # back to n_fft=samples_per_frame (no overlap).
  mfcc_n_fft: 2048
  # Temporal smoothness: L1 on per-frame changes of range-normalised control
  # trajectories, sum_p smooth_weights[p] * mean|Δp_norm|. Params not listed
  # in smooth_weights are unpenalised. See LossConfig for details.
  # Baseline for the rest-pose experiment is run 2kzb65qc (s6-wdiam0.3):
  # smooth and accel both on at 0.3. Same relative weights for both terms, as
  # every run so far has used, now also covering voiceness and intensity --
  # the two source params were previously unpenalised and free to jitter.
  smooth: 0.3
  smooth_weights:
    tongueIndex: 1.0
    constrictionIndex: 1.0
    tongueDiameter: 0.3
    constrictionDiameter: 0.3
    lipDiameter: 0.3
    voiceness: 0.1
    intensity: 0.1
  # Same L1 on the *second* difference: penalises direction changes rather
  # than movement, so a fast steady gesture is free and only zigzag is
  # charged. See LossConfig.accel.
  accel: 0.3
  accel_weights:
    tongueIndex: 1.0
    constrictionIndex: 1.0
    tongueDiameter: 0.3
    constrictionDiameter: 0.3
    lipDiameter: 0.3
    voiceness: 0.1
    intensity: 0.1
  # Rest posture: lips almost closed, tongue body down, tongue tip down.
  # A constant (L1) pull toward this pose — see LossConfig.rest and
  # scripts/calibrate_rest_prior.py. It is meant to decide only the frames the
  # recon loss is indifferent about (silence), not to reshape articulation
  # during speech. Note the L1 *value* is large (~1.2) even though its
  # gradient is small, so train/loss is not comparable to a run without it —
  # compare train/recon_loss and eval/wer instead.
  #
  # 0.01, i.e. ~1 % of each param's median speech-frame recon gradient. Two
  # stronger settings were measured first, and both cost intelligibility:
  #   rest=0.15 (run irdqz9gv, killed at 11.8k) froze the tongue-tip
  #     constriction dead at its target, param_variation 3e-5 vs. the
  #     baseline's 1.4e-2, WER ~2x baseline.
  #   rest=0.04 (run 1idcg86v, 30k) reached the pose -- silent-frame distance
  #     1.46 -> 0.30 against baseline 2kzb65qc -- but WER 0.246 -> 0.357, and
  #     constrictionDiameter still sat on the target on *all* frames (0.027)
  #     rather than only silent ones (0.028), i.e. still suppressed.
  # The median is the wrong statistic to size against: these gradients are
  # heavy-tailed, large only in the frames where that articulator does the
  # work, so even a few percent of the median overrides the low-gradient
  # majority of frames.
  rest: 0.01
  rest_targets:
    lipDiameter: 0.3          # top of the [0, 0.3] closure band: almost closed
    tongueDiameter: 3.5       # max of [1.5, 3.5]: tongue body down
    constrictionDiameter: 3.0 # max of [-2, 3]: no tongue-tip constriction
  rest_weights:
    lipDiameter: 0.3
    tongueDiameter: 1.0
    constrictionDiameter: 1.0
  # SSL feature-matching (perceptual) loss. On by default: it is what makes the
  # controller intelligible, MFCC alone is not enough.
  ssl: 1.0
  # HF id. Others tried: facebook/hubert-base-ls960,
  # microsoft/wavlm-base-plus, unclear which wins
  ssl_model: facebook/wav2vec2-base-960h
  ssl_layer: 6
  ssl_distance: L1  # L1 | L2 | cosine

log:
  wandb_project: samuel
  wandb_entity: moboehle-kyutai
  wandb_mode: online
  log_every: 200
  eval_every: 1000
  ckpt_every: 2000
  n_eval_clips: 200
  # Eval-clip length (s). null -> match training (data.chunk_seconds). Set e.g.
  # 10.0 for finer WER/CER and sustained-intelligibility measurement.
  eval_chunk_seconds: 10.0
  n_audio_samples: 10
  pitch_fmin: 70.0
  pitch_fmax: 500.0
  pitch_voiced_prob_threshold: 0.5
  asr_whisper_size: base

run:
  runs_root: runs
  name: ???
  seed: 0

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
