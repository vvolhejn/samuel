model:
  encoder:
    channels: 1
    dimension: 128
    n_filters: 32
    n_residual_layers: 3
    ratios: [8, 5, 4, 2]
    kernel_size: 7
    last_kernel_size: 7
    residual_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2

  # 512 samples = ~86.13 Hz at 44.1 kHz. Matches the loss hop and the
  # pitch-cache hop.
  samples_per_frame: 512
  n_buckets: 32
  # Straight-through (one-hot) Gumbel-softmax during training instead of the
  # soft expectation over bucket centers. Eval always snaps to argmax.
  gumbel_hard: false

  # Slew-rate limiter: hard cap on how fast each param may move, in fractions
  # of its own [lo, hi] range per second (2.0 = full range in 0.5 s). Applied
  # at train and eval time to the emitted trajectory, so unlike loss.smooth it
  # is a constraint the model cannot buy its way out of.
  #
  # Effective limit = rate_limit_scale * rate_limits[p]. null scale = off,
  # which keeps this an opt-in experiment; sweep the constraint with a single
  # override, e.g. model.rate_limit_scale=2.0.
  rate_limit_scale: null
  # Base speeds, ordered inverse to loss.smooth_weights: params that must snap
  # get large limits, params that should glide get small ones. Calibrated
  # against a 30k-step run's measured trajectories -- at scale 1.0 these sit
  # near the p75-p90 of its per-frame movement, so ordinary gestures pass and
  # the jump tail is cut. Times below are how long a full-range traverse takes.
  rate_limits:
    tongueIndex: 4.0           # 250 ms -- tongue body, slowest articulator
    tongueDiameter: 8.0        # 125 ms
    constrictionIndex: 4.0     # 250 ms -- tongue-tip place of articulation
    constrictionDiameter: 15.0 #  67 ms -- must snap shut/open for stops
    lipDiameter: 15.0          #  67 ms -- lip closure/release
  # "tanh" (default): same hard bound as clamp but with a soft knee, so
  # trajectories that push the limit get bent rather than cornered. Post-hoc on
  # a 30k checkpoint it matched clamp's WER at a markedly lower direction-
  # reversal rate (0.29 vs 0.34). "clamp" is the exact box, which gives a
  # saturated frame zero gradient to its own logits.
  rate_limit_mode: tanh

  # (lo, hi, init) per trainable parameter. ``frequency`` is supplied
  # externally from the pyin cache. ``intensity`` is trainable: the synth
  # output is never gain-matched (see data.target_rms), so the model needs a
  # level knob of its own.
  param_spec:
    voiceness:            [0.0, 1.0, 0.6]
    intensity:            [0.0, 1.0, 1.0]
    tongueIndex:          [10.0, 35.0, 20.0]
    tongueDiameter:       [1.5, 3.5, 2.4]
    # Tongue-tip constriction: capped at the lip region start (39); the lips
    # are a separate fixed-position constriction driven by lipDiameter.
    constrictionIndex:    [22.0, 39.0, 33.0]
    constrictionDiameter: [-2.0, 3.0, 1.25]
    # Lip constriction at the last tract index. Non-negative: [0, 0.3] full
    # closure (b/p), (0.3, 0.7) fricative (f), >= 0.7 open. The velum stays
    # driven by constrictionDiameter only.
    lipDiameter:          [0.0, 3.0, 1.25]

  frozen_values:
    vibratoWobble: 0.0
    vibratoFrequency: 6.0
    vibratoGain: 0.0
    tractLength: 44.0
